name: Update LeetCode Dashboard

on:
  schedule:
    - cron: "30 18 * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/generate_leetcode.py"
      - ".github/workflows/leetcode.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate LeetCode dashboard
        run: |
          python scripts/generate_leetcode.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/leetcode-dashboard.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update LeetCode dashboard"
          git push
